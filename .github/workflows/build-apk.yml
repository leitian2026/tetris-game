name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare www folder
        run: |
          mkdir -p www
          cp index.html game.js ui.js manifest.json sw.js www/
          echo '' > www/icon-192.png
          echo '' > www/icon-512.png

      - name: Install dependencies
        run: npm install

      - name: Update capacitor config for www
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.leitian.tetris",
            "appName": "俄罗斯方块",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tetris-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: List output
        run: ls -lh android/app/build/outputs/apk/debug/ || true
