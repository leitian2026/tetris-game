<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>俄罗斯方块</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230f172a'/><rect x='20' y='20' width='25' height='25' fill='%233b82f6'/><rect x='45' y='20' width='25' height='25' fill='%23ef4444'/><rect x='20' y='45' width='25' height='25' fill='%2322c55e'/><rect x='45' y='45' width='25' height='25' fill='%23eab308'/></svg>" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      background: #0f172a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      user-select: none;
      touch-action: none;
    }
    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 6px;
      padding-bottom: max(6px, env(safe-area-inset-bottom));
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 2px 6px;
      flex-shrink: 0;
    }
    .header h1 { font-size: 1.15rem; font-weight: 700; letter-spacing: 1px; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .stats { display: flex; gap: 12px; font-size: 0.8rem; }
    .stat { text-align: center; }
    .stat-label { color: #94a3b8; font-size: 0.65rem; }
    .stat-value { font-weight: 700; font-size: 1rem; color: #38bdf8; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 50%;
      border: 1px solid #334155; background: #1e293b; color: #e2e8f0;
      font-size: 1rem; display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .icon-btn:active { background: #334155; }

    .main {
      flex: 1;
      display: flex;
      gap: 8px;
      min-height: 0;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    .board-outer {
      flex: 1;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      min-width: 0;
      min-height: 0;
    }
    .board-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #1e293b;
      border-radius: 12px;
      border: 2px solid #334155;
      overflow: hidden;
      position: relative;
      /* JS 设置具体像素宽高 */
      width: 200px;
      height: 400px;
    }
    #board {
      display: block;
      image-rendering: pixelated;
      width: 100%;
      height: 100%;
    }
    .side {
      width: var(--side-w, 82px);
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }
    .side.hidden-side { display: none; }
    .panel {
      background: #1e293b;
      border-radius: 10px;
      border: 1px solid #334155;
      padding: 6px;
      text-align: center;
    }
    .panel-title { font-size: 0.65rem; color: #94a3b8; margin-bottom: 4px; }
    #next { display: block; margin: 0 auto; image-rendering: pixelated; }
    .btn {
      background: #334155; border: none; color: #e2e8f0;
      padding: 9px 6px; border-radius: 8px;
      font-size: 0.78rem; font-weight: 600; cursor: pointer; width: 100%;
    }
    .btn:active { background: #475569; }
    .btn-primary { background: #2563eb; }
    .btn-primary:active { background: #1d4ed8; }
    .btn-danger { background: #dc2626; }

    .controls {
      position: relative;
      flex-shrink: 0;
      height: var(--ctrl-area-h, 150px);
      margin-top: 6px;
      touch-action: none;
    }
    .ctrl-btn {
      position: absolute;
      width: var(--btn-size, 56px);
      height: var(--btn-size, 56px);
      border-radius: 50%;
      background: #1e293b;
      border: 2px solid #475569;
      color: #e2e8f0;
      font-size: calc(var(--btn-size, 56px) * 0.38);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.35);
      z-index: 5;
      touch-action: none;
    }
    .ctrl-btn:active { background: #334155; transform: scale(0.92); }
    .ctrl-btn.small-text {
      font-size: calc(var(--btn-size, 56px) * 0.22);
      font-weight: 600; text-align: center; line-height: 1.15; padding: 4px;
    }
    .ctrl-btn.accent {
      background: #1e3a5f; border-color: #3b82f6; color: #93c5fd;
    }
    .ctrl-btn.accent:active { background: #1e40af; }
    .controls.edit-mode .ctrl-btn {
      outline: 2px dashed #38bdf8;
      outline-offset: 3px;
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      50% { outline-color: #fbbf24; }
    }

    /* 编辑模式顶部提示条 */
    .edit-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 90;
      background: #1d4ed8;
      color: #fff;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.9rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.4);
    }
    .edit-bar.hidden { display: none; }
    .edit-bar button {
      background: #fff; color: #1d4ed8; border: none;
      border-radius: 8px; padding: 6px 14px; font-weight: 700; font-size: 0.85rem;
    }

    .overlay {
      position: absolute; inset: 0;
      background: rgba(15, 23, 42, 0.88);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; z-index: 10; border-radius: 10px;
    }
    .overlay.hidden { display: none; }
    .overlay h2 { font-size: 1.5rem; font-weight: 800; }
    .overlay p { color: #94a3b8; font-size: 0.9rem; }
    .overlay .btn { width: auto; padding: 12px 28px; font-size: 1rem; }

    .settings-mask {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 100;
      display: flex; align-items: flex-end; justify-content: center;
    }
    .settings-mask.hidden { display: none; }
    .settings-panel {
      width: 100%; max-width: 480px; max-height: 88vh;
      overflow-y: auto;
      background: #1e293b;
      border-radius: 16px 16px 0 0;
      padding: 16px 18px 28px;
      border: 1px solid #334155; border-bottom: none;
      -webkit-overflow-scrolling: touch;
    }
    .settings-panel h3 {
      font-size: 1.1rem; margin-bottom: 14px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .settings-panel h3 button {
      background: none; border: none; color: #94a3b8; font-size: 1.3rem;
      cursor: pointer; padding: 4px 8px;
    }
    .setting-item { margin-bottom: 16px; }
    .setting-item label {
      display: flex; justify-content: space-between;
      font-size: 0.85rem; color: #cbd5e1; margin-bottom: 6px;
    }
    .setting-item label span { color: #38bdf8; font-weight: 600; }
    .setting-item input[type="range"] { width: 100%; accent-color: #3b82f6; }
    .setting-item input[type="checkbox"] { width: auto; margin-right: 8px; accent-color: #3b82f6; }
    .layout-opts { display: flex; gap: 8px; flex-wrap: wrap; }
    .layout-opt {
      flex: 1; min-width: 90px; padding: 10px 8px; border-radius: 10px;
      border: 2px solid #334155; background: #0f172a; color: #e2e8f0;
      font-size: 0.8rem; text-align: center; cursor: pointer;
    }
    .layout-opt.active { border-color: #3b82f6; background: #1e3a5f; color: #93c5fd; }
    .settings-actions { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
    .settings-actions .btn { flex: 1; min-width: 100px; padding: 12px; }
    .hint { font-size: 0.75rem; color: #64748b; margin-top: 4px; line-height: 1.4; }
    .section-title {
      font-size: 0.75rem; color: #64748b; text-transform: uppercase;
      letter-spacing: 1px; margin: 18px 0 10px; padding-top: 8px;
      border-top: 1px solid #334155;
    }
  </style>
</head>
<body>
  <div class="edit-bar hidden" id="editBar">
    <span>拖动按键调整位置</span>
    <button id="doneEditBtn">完成编辑</button>
  </div>

  <div class="app">
    <div class="header">
      <h1>TETRIS</h1>
      <div class="header-right">
        <div class="stats">
          <div class="stat">
            <div class="stat-label">分数</div>
            <div class="stat-value" id="score">0</div>
          </div>
          <div class="stat">
            <div class="stat-label">等级</div>
            <div class="stat-value" id="level">1</div>
          </div>
          <div class="stat">
            <div class="stat-label">消除</div>
            <div class="stat-value" id="lines">0</div>
          </div>
        </div>
        <button class="icon-btn" id="settingsBtn" title="设置">⚙</button>
      </div>
    </div>

    <div class="main" id="mainArea">
      <div class="board-outer" id="boardOuter">
        <div class="board-wrap" id="boardWrap">
          <canvas id="board" width="300" height="600"></canvas>
          <div class="overlay" id="startOverlay">
            <h2>俄罗斯方块</h2>
            <p>点击开始游戏</p>
            <button class="btn btn-primary" id="startBtn">开始</button>
          </div>
          <div class="overlay hidden" id="pauseOverlay">
            <h2>已暂停</h2>
            <button class="btn btn-primary" id="resumeBtn">继续</button>
          </div>
          <div class="overlay hidden" id="gameoverOverlay">
            <h2>游戏结束</h2>
            <p id="finalScore">分数: 0</p>
            <button class="btn btn-primary" id="restartBtn">再来一局</button>
          </div>
        </div>
      </div>

      <div class="side" id="sidePanel">
        <div class="panel" id="nextPanel">
          <div class="panel-title">下一个</div>
          <canvas id="next" width="72" height="72"></canvas>
        </div>
        <button class="btn" id="pauseBtn">暂停</button>
        <button class="btn btn-danger" id="resetBtn">重开</button>
      </div>
    </div>

    <div class="controls" id="controls">
      <div class="ctrl-btn" id="btnLeft" data-key="left">←</div>
      <div class="ctrl-btn" id="btnDown" data-key="down">↓</div>
      <div class="ctrl-btn" id="btnRight" data-key="right">→</div>
      <div class="ctrl-btn" id="btnRotate" data-key="rotate">↻</div>
      <div class="ctrl-btn small-text accent" id="btnDrop" data-key="drop">落<br>下</div>
    </div>
  </div>

  <div class="settings-mask hidden" id="settingsMask">
    <div class="settings-panel" id="settingsPanel">
      <h3>自定义设置 <button id="closeSettings">✕</button></h3>

      <div class="section-title">游戏区域</div>
      <div class="setting-item">
        <label>游戏框大小 <span id="boardScaleVal">100%</span></label>
        <input type="range" id="boardScale" min="50" max="110" value="100" />
        <p class="hint">相对可用区域的缩放比例</p>
      </div>

      <div class="section-title">右侧面板</div>
      <div class="setting-item">
        <label><input type="checkbox" id="showSide" checked /> 显示右侧面板（下一个/暂停/重开）</label>
      </div>
      <div class="setting-item">
        <label>右侧面板宽度 <span id="sideWVal">82</span></label>
        <input type="range" id="sideWidth" min="60" max="120" value="82" />
      </div>

      <div class="section-title">操作按键</div>
      <div class="setting-item">
        <label>按键大小 <span id="btnSizeVal">56</span></label>
        <input type="range" id="btnSize" min="40" max="84" value="56" />
      </div>
      <div class="setting-item">
        <label>按键区域高度 <span id="ctrlHVal">150</span></label>
        <input type="range" id="ctrlHeight" min="120" max="240" value="150" />
      </div>
      <div class="setting-item">
        <label>按键布局</label>
        <div class="layout-opts">
          <div class="layout-opt active" data-layout="bottom">底部居中</div>
          <div class="layout-opt" data-layout="split">左右分离</div>
          <div class="layout-opt" data-layout="arc">弧形</div>
        </div>
      </div>

      <div class="settings-actions">
        <button class="btn" id="startEditBtn" style="background:#1d4ed8;">拖动调整按键位置</button>
      </div>
      <p class="hint">点击后关闭设置，进入拖动模式；拖完点顶部「完成编辑」保存</p>

      <div class="settings-actions" style="margin-top:16px;">
        <button class="btn" id="resetLayout">恢复默认</button>
        <button class="btn btn-primary" id="saveSettings">保存并关闭</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
  <script src="ui.js"></script>
</body>
</html>
